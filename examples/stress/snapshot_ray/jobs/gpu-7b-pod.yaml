apiVersion: v1
kind: Pod
metadata:
  name: grpo-gpu-7b
spec:
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-nodepool: gpu-pool
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  volumes:
  - name: script
    configMap:
      name: grpo-script
  - name: cache
    emptyDir: {}
  containers:
  - name: trainer
    image: python:3.11-slim
    workingDir: /work
    env:
    - {name: HF_HOME, value: "/cache/hf"}
    - {name: LD_LIBRARY_PATH, value: "/usr/local/nvidia/lib64"}
    - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
    - {name: MODEL, value: "Qwen/Qwen2.5-0.5B-Instruct"}
    - {name: USE_LORA, value: "0"}
    - {name: BF16, value: "1"}
    - {name: MAX_STEPS, value: "10000"}
    - {name: MAX_COMPLETION, value: "128"}
    - {name: REWARD_SANDBOXES, value: "8"}
    - {name: NUM_GENERATIONS, value: "4"}
    - {name: SUSPEND_MODE, value: "per_step"}
    - {name: WARMPOOL, value: "python-snapshot-pool"}
    - {name: CLAIM_TIMEOUT, value: "600"}
    volumeMounts:
    - {name: script, mountPath: /work}
    - {name: cache, mountPath: /cache}
    resources:
      requests: {cpu: "16", memory: "64Gi", nvidia.com/gpu: 2}
      limits: {cpu: "16", memory: "64Gi", nvidia.com/gpu: 2}
    command: ["bash", "-c"]
    args:
    - |
      set -ex
      apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc python3-dev > /dev/null
      pip install --no-cache-dir torch
      pip install --no-cache-dir "trl==0.21.0" "transformers<5" datasets accelerate peft k8s-agent-sandbox==1.0.0
      python -c "import torch; print('CUDA:', torch.cuda.is_available(), torch.cuda.device_count())"
      python /work/grpo_sandbox_train.py
