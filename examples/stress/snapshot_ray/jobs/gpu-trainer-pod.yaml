apiVersion: v1
kind: Pod
metadata:
  name: grpo-gpu-trainer
spec:
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-nodepool: gpu-pool
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  volumes:
  - name: script
    configMap:
      name: grpo-script
  - name: cache
    emptyDir: {}
  containers:
  - name: trainer
    image: python:3.11-slim
    workingDir: /work
    env:
    - {name: HF_HOME, value: "/cache/hf"}
    - {name: LD_LIBRARY_PATH, value: "/usr/local/nvidia/lib64"}
    - {name: MAX_STEPS, value: "50"}
    - {name: MAX_COMPLETION, value: "128"}
    - {name: REWARD_SANDBOXES, value: "8"}
    - {name: NUM_GENERATIONS, value: "4"}
    - {name: SUSPEND_MODE, value: "per_step"}
    - {name: WARMPOOL, value: "python-snapshot-pool"}
    volumeMounts:
    - {name: script, mountPath: /work}
    - {name: cache, mountPath: /cache}
    resources:
      requests: {cpu: "10", memory: "32Gi", nvidia.com/gpu: 1}
      limits: {cpu: "10", memory: "32Gi", nvidia.com/gpu: 1}
    command: ["bash", "-c"]
    args:
    - |
      set -ex
      apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc python3-dev > /dev/null
      pip install --no-cache-dir torch    # default index = CUDA wheels; L4 driver comes from GKE
      pip install --no-cache-dir "trl==0.21.0" "transformers<5" datasets accelerate k8s-agent-sandbox==1.0.0
      python -c "import torch; print('CUDA:', torch.cuda.is_available(), torch.cuda.get_device_name(0))"
      python /work/grpo_sandbox_train.py
